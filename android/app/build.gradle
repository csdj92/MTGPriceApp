apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def bundledLorcanaDbSource = rootProject.file("../prebuilt/lorcana.db")
def bundledLorcanaDbAssetsDir = file("$projectDir/src/main/assets/www")
def bundledLorcanaDbAsset = file("$bundledLorcanaDbAssetsDir/lorcana.db")

// React Native Config
react {
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

android {
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace "com.lorcanacollector"

    defaultConfig {
        applicationId "com.lorcanacollector"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
        
        externalNativeBuild {
            cmake {
                version "3.22.1"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/arm64-v8a/libfbjni.so', 'lib/x86/libfbjni.so', 'lib/armeabi-v7a/libfbjni.so', 'lib/x86_64/libfbjni.so']
        }
    }


    lint {
        checkDependencies true
        disable 'GradleDependency', 'ObsoleteSdkInt', 'DeprecatedApi'
    }

    tasks.withType(com.android.build.gradle.internal.lint.AndroidLintTask) {
        dependsOn ':app:copyReactNativeVectorIconFonts'
    }
}

tasks.register("stageBundledLorcanaDb") {
    inputs.property("bundledLorcanaDbPresent", bundledLorcanaDbSource.exists())
    inputs.property("bundledLorcanaDbLastModified", bundledLorcanaDbSource.exists() ? bundledLorcanaDbSource.lastModified() : 0L)
    inputs.property("bundledLorcanaDbSize", bundledLorcanaDbSource.exists() ? bundledLorcanaDbSource.length() : 0L)
    outputs.file(bundledLorcanaDbAsset)

    doLast {
        bundledLorcanaDbAssetsDir.mkdirs()

        if (bundledLorcanaDbSource.exists()) {
            copy {
                from bundledLorcanaDbSource
                into bundledLorcanaDbAssetsDir
                rename { "lorcana.db" }
            }
            println("[stageBundledLorcanaDb] Packaged ${bundledLorcanaDbSource} into ${bundledLorcanaDbAsset}")
            return
        }

        if (bundledLorcanaDbAsset.exists()) {
            bundledLorcanaDbAsset.delete()
            println("[stageBundledLorcanaDb] Removed stale bundled asset because ${bundledLorcanaDbSource} was not found")
            return
        }

        println("[stageBundledLorcanaDb] No prebuilt Lorcana database found at ${bundledLorcanaDbSource}; build will use runtime API import.")
    }
}

tasks.named("preBuild").configure {
    dependsOn("stageBundledLorcanaDb")
}

dependencies {
    // React Native dependencies
    implementation("com.facebook.react:react-android")
    implementation(project(":react-native-sqlite-storage"))
    implementation(project(":react-native-worklets"))

    // ML Kit Vision Text Recognition
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.mlkit:vision-common:17.3.0"

    // Camera dependencies
    implementation "androidx.camera:camera-core:1.5.3"
    implementation "androidx.camera:camera-camera2:1.5.3"
    implementation "androidx.camera:camera-lifecycle:1.5.3"
    implementation "androidx.camera:camera-view:1.5.3"

    // Provide the actual ListenableFuture classes required by CameraX APIs.
    implementation "com.google.guava:guava:32.1.3-android"

    // React Native Vector Icons
    implementation(project(':react-native-vector-icons'))

    // Hermes or JSC
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation "io.github.react-native-community:jsc-android:2026004.+"
    }

    implementation(project(':react-native-vector-icons'))
}

project.ext.vectoricons = [
    iconFontNames: ['MaterialCommunityIcons.ttf']
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
