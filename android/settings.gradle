pluginManagement {
    includeBuild(
        file("../node_modules/react-native/node_modules/@react-native/gradle-plugin").exists()
            ? "../node_modules/react-native/node_modules/@react-native/gradle-plugin"
            : "../node_modules/@react-native/gradle-plugin"
    )
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = "LorcanaCollector"
includeBuild(
    file("../node_modules/react-native/node_modules/@react-native/gradle-plugin").exists()
        ? "../node_modules/react-native/node_modules/@react-native/gradle-plugin"
        : "../node_modules/@react-native/gradle-plugin"
)

include(":app")

// Include react-native-sqlite-storage
include(":react-native-sqlite-storage")
project(":react-native-sqlite-storage").projectDir = new File(rootProject.projectDir, "../node_modules/react-native-sqlite-storage/platforms/android")

// Include react-native-vector-icons
include(":react-native-vector-icons")
project(":react-native-vector-icons").projectDir = new File(rootProject.projectDir, "../node_modules/react-native-vector-icons/android")

// Include react-native-worklets
include(":react-native-worklets")
project(":react-native-worklets").projectDir = new File(rootProject.projectDir, "../node_modules/react-native-worklets/android")
